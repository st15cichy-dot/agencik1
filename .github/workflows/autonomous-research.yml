name: Autonomous research heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax and paper risk regression checks
        run: |
          node --check lib/research.js
          node --check lib/paper-portfolio.js
          node --check scripts/autonomous-research.mjs
          node --check lib/agent-health.js
          node --check lib/portfolio-analytics.js
          node --check lib/strategy-governance.js
          node --check lib/allocation-intelligence.js
          node --check lib/market-universe.js
          node --check lib/shadow-execution.js
          node --check lib/broker-mapping.js
          node --check lib/shadow-order-preflight.js
          node --check lib/execution-quality.js
          node --check lib/shadow-diagnostic-fixtures.js
          npm run test-core

      - name: Restore previous autonomous memory
        shell: bash
        run: |
          mkdir -p .auto-memory

          if git ls-remote --exit-code --heads origin research-data >/dev/null 2>&1; then
            git fetch origin research-data:refs/remotes/origin/research-data
            git show origin/research-data:latest.json > .auto-memory/latest.json || true
            git show origin/research-data:history.json > .auto-memory/history.json || true
            git show origin/research-data:paper.json > .auto-memory/paper.json || true
            git show origin/research-data:paper-trades.json > .auto-memory/paper-trades.json || true
            git show origin/research-data:journal.json > .auto-memory/journal.json || true
            git show origin/research-data:governance.json > .auto-memory/governance.json || true
            git show origin/research-data:execution-intents.json > .auto-memory/execution-intents.json || true
            git show origin/research-data:preflight-audit.json > .auto-memory/preflight-audit.json || true
            git show origin/research-data:execution-quality.json > .auto-memory/execution-quality.json || true
          fi

      - name: Run autonomous research and paper engine
        env:
          PREVIOUS_LATEST_PATH: .auto-memory/latest.json
          PREVIOUS_HISTORY_PATH: .auto-memory/history.json
          PREVIOUS_PAPER_PATH: .auto-memory/paper.json
          PREVIOUS_TRADES_PATH: .auto-memory/paper-trades.json
          PREVIOUS_JOURNAL_PATH: .auto-memory/journal.json
          PREVIOUS_GOVERNANCE_PATH: .auto-memory/governance.json
          PREVIOUS_EXECUTION_INTENTS_PATH: .auto-memory/execution-intents.json
          PREVIOUS_PREFLIGHT_AUDIT_PATH: .auto-memory/preflight-audit.json
          PREVIOUS_EXECUTION_QUALITY_PATH: .auto-memory/execution-quality.json
        run: node scripts/autonomous-research.mjs

      - name: Prepare public autonomous memory
        shell: bash
        run: |
          mkdir -p /tmp/autonomous-memory
          cp .auto-output/latest.json /tmp/autonomous-memory/latest.json
          cp .auto-output/history.json /tmp/autonomous-memory/history.json
          cp .auto-output/paper.json /tmp/autonomous-memory/paper.json
          cp .auto-output/paper-trades.json /tmp/autonomous-memory/paper-trades.json
          cp .auto-output/journal.json /tmp/autonomous-memory/journal.json
          cp .auto-output/health.json /tmp/autonomous-memory/health.json
          cp .auto-output/analytics.json /tmp/autonomous-memory/analytics.json
          cp .auto-output/governance.json /tmp/autonomous-memory/governance.json
          cp .auto-output/allocation.json /tmp/autonomous-memory/allocation.json
          cp .auto-output/execution-intents.json /tmp/autonomous-memory/execution-intents.json
          cp .auto-output/preflight-audit.json /tmp/autonomous-memory/preflight-audit.json
          cp .auto-output/execution-quality.json /tmp/autonomous-memory/execution-quality.json

          cat > /tmp/autonomous-memory/README.md <<'EOF'
          # Autonomous Investor — research & paper memory

          This branch is generated automatically.

          It stores public market research and simulated paper-trading state only:
          - latest.json
          - history.json
          - paper.json
          - paper-trades.json
          - journal.json
          - health.json
          - analytics.json
          - governance.json
          - allocation.json
          - execution-intents.json
          - preflight-audit.json
          - execution-quality.json

          It must never contain broker credentials, API secrets, account identifiers,
          real-money positions, or private user data.
          EOF

          cat > /tmp/autonomous-memory/vercel.json <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "git": {
              "deploymentEnabled": false
            }
          }
          EOF

      - name: Publish research-data branch
        shell: bash
        run: |
          git config user.name "autonomous-investor-bot"
          git config user.email "actions@users.noreply.github.com"

          git checkout --orphan research-data-publish
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          cp /tmp/autonomous-memory/latest.json latest.json
          cp /tmp/autonomous-memory/history.json history.json
          cp /tmp/autonomous-memory/paper.json paper.json
          cp /tmp/autonomous-memory/paper-trades.json paper-trades.json
          cp /tmp/autonomous-memory/journal.json journal.json
          cp /tmp/autonomous-memory/health.json health.json
          cp /tmp/autonomous-memory/analytics.json analytics.json
          cp /tmp/autonomous-memory/governance.json governance.json
          cp /tmp/autonomous-memory/allocation.json allocation.json
          cp /tmp/autonomous-memory/execution-intents.json execution-intents.json
          cp /tmp/autonomous-memory/preflight-audit.json preflight-audit.json
          cp /tmp/autonomous-memory/execution-quality.json execution-quality.json
          cp /tmp/autonomous-memory/README.md README.md
          cp /tmp/autonomous-memory/vercel.json vercel.json

          git add latest.json history.json paper.json paper-trades.json journal.json health.json analytics.json governance.json allocation.json execution-intents.json preflight-audit.json execution-quality.json README.md vercel.json
          git commit -m "Update autonomous research and paper memory"
          git push --force origin HEAD:research-data
