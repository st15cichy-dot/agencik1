name: CI

on:
  push:
    branches:
      - main
      - "chatgpt-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check lib/research.js
          node --check lib/paper-portfolio.js
          node --check scripts/autonomous-research.mjs
          node --check lib/agent-health.js
          node --check lib/watchdog.js
          node --check lib/portfolio-analytics.js
          node --check lib/strategy-governance.js
          node --check lib/allocation-intelligence.js
          node --check lib/market-universe.js
          node --check scripts/health-watchdog.mjs

      - name: Core regression suites
        run: npm run test-core

      - name: Next.js production build
        run: npm run build
