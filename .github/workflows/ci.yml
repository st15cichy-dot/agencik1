name: CI

on:
  push:
    branches:
      - main
      - "chatgpt-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check lib/research.js
          node --check lib/paper-portfolio.js
          node --check scripts/autonomous-research.mjs
          node --check lib/agent-health.js
          node --check lib/watchdog.js
          node --check lib/portfolio-analytics.js
          node --check lib/strategy-governance.js
          node --check lib/allocation-intelligence.js
          node --check lib/market-universe.js
          node --check lib/shadow-execution.js
          node --check lib/broker-mapping.js
          node --check lib/shadow-order-preflight.js
          node --check lib/execution-quality.js
          node --check lib/shadow-diagnostic-fixtures.js
          node --check scripts/health-watchdog.mjs
          node --check scripts/verify-development.mjs
          node --check lib/autonomous-memory.js
          node --check lib/paper-evidence.js
          bash -n scripts/restore-autonomous-memory.sh

      - name: Install local OCR test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          python -m venv .development-output/screen-venv
          .development-output/screen-venv/bin/python -m pip install -r experiments/screen-demo/requirements.txt

      - name: Test isolated screen mock and real OCR
        run: |
          mkdir -p .development-output/screen-demo-evidence
          .development-output/screen-venv/bin/python -m unittest discover -s experiments/screen-demo -p 'test_*.py' -v
          .development-output/screen-venv/bin/python experiments/screen-demo/screen_demo.py --render-fixtures .development-output/screen-demo-evidence
          .development-output/screen-venv/bin/python experiments/screen-demo/screen_demo.py --self-demo --output .development-output/screen-demo-evidence > .development-output/screen-demo-evidence/self-demo.json
          .development-output/screen-venv/bin/python experiments/screen-demo/screen_demo.py --self-demo --side SELL --intent DEMO002 --output .development-output/screen-demo-evidence > .development-output/screen-demo-evidence/sell-demo.json
          cat .development-output/screen-demo-evidence/self-demo.json
          cat .development-output/screen-demo-evidence/sell-demo.json

      - name: Upload mock screen evidence (not native Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-mock-evidence-${{ github.sha }}
          path: .development-output/screen-demo-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Verify development handoff (core, safety and build)
        run: npm run verify-development

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-verification-${{ github.sha }}
          path: .development-output/verification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Write verification summary
        if: always()
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from "node:fs";
          const file = ".development-output/verification.json";
          console.log("# Development verification");
          if (!fs.existsSync(file)) {
            console.log("No report: verification did not start or could not write evidence. Check job logs.");
          } else {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(`Status: **${report.status}**`);
            console.log("See the verification artifact for the tested commit, source fingerprint and check results.");
            console.log("Independent code review must be recorded in the PR; this deterministic job does not perform AI review.");
          }
          NODE
